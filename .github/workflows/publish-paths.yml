name: Publish path data bundle

on:
  push:
    branches: [ new-main ]
    paths:
      - 'QuestPaths/**'
      - 'GatheringPaths/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  publish-paths:
    # Runs on the maintainer's local Linux runner (in China) so uploads to
    # RainYun/COS stay in-country instead of crossing the border from GitHub's
    # hosted runners.
    runs-on: [self-hosted, linux, qst-paths]
    timeout-minutes: 30
    if: contains(fromJson(vars.RELEASE_USERNAMES), github.actor)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine channel
        id: channel
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          if [ "$BRANCH" = "new-main" ]; then
            echo "channel=latest" >> $GITHUB_OUTPUT
          else
            echo "channel=testing" >> $GITHUB_OUTPUT
          fi

      - name: Compute data version and format
        id: meta
        run: |
          DATA_VERSION=$(git log -1 --format=%ct)
          MIN_FORMAT=$(grep -oP 'CurrentVersion\s*=\s*\K[0-9]+' Questionable.Model/PathDataFormat.cs | head -1)
          if [ -z "$DATA_VERSION" ] || [ -z "$MIN_FORMAT" ]; then
            echo "Error: could not compute data version / plugin data format"
            exit 1
          fi
          echo "data_version=$DATA_VERSION" >> $GITHUB_OUTPUT
          echo "min_format=$MIN_FORMAT" >> $GITHUB_OUTPUT
          echo "Data version: $DATA_VERSION, minimum plugin data format: $MIN_FORMAT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Validate quest JSON against the schema
        run: dotnet test QuestPaths.JsonValidator/QuestPaths.JsonValidator.csproj -c Release

      - name: Build bundle
        id: bundle
        run: |
          # Self-hosted runners reuse their workspace; zip would append to a
          # previous bundle, so start from a clean output directory.
          rm -rf out manifest.json
          mkdir -p out
          GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CHANNEL=${{ steps.channel.outputs.channel }}

          cat > manifest.json <<EOF
          {
            "schemaVersion": 1,
            "dataVersion": ${{ steps.meta.outputs.data_version }},
            "minPluginDataFormat": ${{ steps.meta.outputs.min_format }},
            "maxPluginDataFormat": null,
            "generatedAt": "$GENERATED_AT"
          }
          EOF

          zip -r -q -X out/paths.zip QuestPaths/?.x* GatheringPaths/?.x*
          zip -q -X -j out/paths.zip manifest.json

          SHA=$(sha256sum out/paths.zip | cut -d' ' -f1)
          SHA12=${SHA:0:12}
          # Content-addressed bundle name: the bytes never change for a given name,
          # so it stays valid forever even behind a cache.
          COS_URL="https://questionable-1304787170.cos.ap-guangzhou.myqcloud.com/paths-${CHANNEL}/paths-${SHA12}.zip"
          RAINYUN_URL="https://cn-nb1.rains3.com/qst/paths-${CHANNEL}/paths.zip"
          GH_URL="https://github.com/${{ github.repository }}/releases/download/paths-${CHANNEL}/paths.zip"

          # Tencent COS manifest (primary)
          cat > out/manifest-${CHANNEL}.json <<EOF
          {
            "schemaVersion": 1,
            "dataVersion": ${{ steps.meta.outputs.data_version }},
            "minPluginDataFormat": ${{ steps.meta.outputs.min_format }},
            "maxPluginDataFormat": null,
            "bundleUrl": "$COS_URL",
            "bundleSha256": "$SHA",
            "generatedAt": "$GENERATED_AT"
          }
          EOF

          # RainYun manifest (transitional mirror for older clients)
          cat > out/manifest-${CHANNEL}-rainyun.json <<EOF
          {
            "schemaVersion": 1,
            "dataVersion": ${{ steps.meta.outputs.data_version }},
            "minPluginDataFormat": ${{ steps.meta.outputs.min_format }},
            "maxPluginDataFormat": null,
            "bundleUrl": "$RAINYUN_URL",
            "bundleSha256": "$SHA",
            "generatedAt": "$GENERATED_AT"
          }
          EOF

          # GitHub Release manifest (fallback); also staged under the plain name so the
          # release step can upload it without relying on a rename syntax.
          cat > out/manifest-${CHANNEL}-gh.json <<EOF
          {
            "schemaVersion": 1,
            "dataVersion": ${{ steps.meta.outputs.data_version }},
            "minPluginDataFormat": ${{ steps.meta.outputs.min_format }},
            "maxPluginDataFormat": null,
            "bundleUrl": "$GH_URL",
            "bundleSha256": "$SHA",
            "generatedAt": "$GENERATED_AT"
          }
          EOF

          mkdir -p out/release
          cp out/manifest-${CHANNEL}-gh.json out/release/manifest-${CHANNEL}.json

          echo "sha12=$SHA12" >> $GITHUB_OUTPUT
          echo "Bundle SHA-256: $SHA"
          ls -la out/

      - name: Configure coscli
        run: |
          command -v coscli > /dev/null || {
            echo "coscli not found in PATH; install it on the runner (see docs)"
            exit 1
          }
          coscli config set --secret_id "${{ secrets.TENCENT_SECRET_ID }}" --secret_key "${{ secrets.TENCENT_SECRET_KEY }}"
          # The runner keeps its coscli config between runs; only add the bucket once.
          if ! coscli config show | grep -q "questionable-1304787170"; then
            coscli config add -b questionable-1304787170 -r ap-guangzhou -e cos.ap-guangzhou.myqcloud.com -a qst
          fi
          coscli config show

      - name: Upload to Tencent COS
        continue-on-error: true
        id: cos_upload
        run: |
          CHANNEL=${{ steps.channel.outputs.channel }}
          SHA12=${{ steps.bundle.outputs.sha12 }}
          # Upload the zip FIRST and the manifest LAST: clients only ever see
          # either the previous consistent pair, or the new zip + new manifest.
          # part-size defaults to 32MB, which would send our ~4MB bundle over a
          # single slow cross-border connection; 1MB parts across 8 connections
          # upload far faster, and the retry flags absorb rate limiting.
          if curl -fsI --max-time 20 "https://questionable-1304787170.cos.ap-guangzhou.myqcloud.com/paths-${CHANNEL}/paths-${SHA12}.zip" > /dev/null; then
            echo "Bundle ${SHA12} already exists in COS; skipping upload"
          else
            coscli cp out/paths.zip cos://qst/paths-${CHANNEL}/paths-${SHA12}.zip \
              --part-size 1 --thread-num 8 --retry-num 10 --err-retry-num 10
          fi
          coscli cp out/manifest-${CHANNEL}.json cos://qst/paths-${CHANNEL}/manifest-${CHANNEL}.json \
            --retry-num 10 --err-retry-num 10

      - name: Fallback - upload GitHub manifest to COS
        if: steps.cos_upload.outcome == 'failure'
        continue-on-error: true
        run: |
          CHANNEL=${{ steps.channel.outputs.channel }}
          cp out/manifest-${CHANNEL}-gh.json out/manifest-${CHANNEL}.json
          coscli cp out/manifest-${CHANNEL}.json cos://qst/paths-${CHANNEL}/manifest-${CHANNEL}.json

      - name: Configure AWS CLI for RainYun S3
        run: |
          aws configure set aws_access_key_id "${{ secrets.RAINYUN_ACCESS_KEY }}"
          aws configure set aws_secret_access_key "${{ secrets.RAINYUN_SECRET_KEY }}"
          aws configure set default.region us-east-1
          # Cross-border uploads to RainYun are slow on a single stream; use small
          # multipart chunks so parts upload in parallel, and be patient on timeouts.
          aws configure set default.s3.multipart_threshold 1MB
          aws configure set default.s3.multipart_chunksize 1MB
          aws configure set default.s3.max_concurrent_requests 6
          aws configure set default.retry_mode adaptive
          aws configure set default.max_attempts 10

      - name: Check whether the RainYun bundle is already up to date
        id: rainyun_state
        continue-on-error: true
        run: |
          CHANNEL=${{ steps.channel.outputs.channel }}
          LOCAL_SHA=$(sha256sum out/paths.zip | cut -d' ' -f1)
          MANIFEST=$(curl -fsS --max-time 30 "https://cn-nb1.rains3.com/qst/paths-${CHANNEL}/manifest-${CHANNEL}.json" || true)
          REMOTE_SHA=$(echo "$MANIFEST" | grep -o '"bundleSha256"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/')
          REMOTE_URL=$(echo "$MANIFEST" | grep -o '"bundleUrl"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/')
          if [ "$REMOTE_SHA" = "$LOCAL_SHA" ] && echo "$REMOTE_URL" | grep -q "cn-nb1.rains3.com"; then
            echo "skip_zip=true" >> $GITHUB_OUTPUT
            echo "RainYun already serves this bundle ($LOCAL_SHA); skipping zip upload"
          else
            echo "skip_zip=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload to RainYun S3 (transitional)
        continue-on-error: true
        id: s3_upload
        run: |
          CHANNEL=${{ steps.channel.outputs.channel }}
          # Old clients (before the COS migration) still read this bucket, so it
          # keeps the fixed bundle name and its own manifest. zip first, manifest last.
          if [ "${{ steps.rainyun_state.outputs.skip_zip }}" != "true" ]; then
            aws s3 cp out/paths.zip \
              s3://qst/paths-${CHANNEL}/paths.zip \
              --endpoint-url https://cn-nb1.rains3.com --acl public-read \
              --cli-connect-timeout 60 --cli-read-timeout 600
          else
            echo "Skipping zip upload; bundle unchanged"
          fi
          aws s3 cp out/manifest-${CHANNEL}-rainyun.json \
            s3://qst/paths-${CHANNEL}/manifest-${CHANNEL}.json \
            --endpoint-url https://cn-nb1.rains3.com --acl public-read \
            --cli-connect-timeout 60 --cli-read-timeout 600

      - name: Fallback - upload GitHub manifest to RainYun
        if: steps.s3_upload.outcome == 'failure'
        continue-on-error: true
        run: |
          CHANNEL=${{ steps.channel.outputs.channel }}
          cp out/manifest-${CHANNEL}-gh.json out/manifest-${CHANNEL}.json
          aws s3 cp out/manifest-${CHANNEL}.json \
            s3://qst/paths-${CHANNEL}/manifest-${CHANNEL}.json \
            --endpoint-url https://cn-nb1.rains3.com --acl public-read

      - name: Publish path bundle release (backup)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paths-${{ steps.channel.outputs.channel }}
          name: "Path data (${{ steps.channel.outputs.channel }})"
          body: |
            Rolling quest/gathering path data bundle for the **${{ steps.channel.outputs.channel }}** channel.

            - Data version: `${{ steps.meta.outputs.data_version }}`
            - Minimum plugin data format: `${{ steps.meta.outputs.min_format }}`

            Updated automatically when path data changes. This does not trigger a plugin release.
          files: |
            out/paths.zip
            out/release/manifest-${{ steps.channel.outputs.channel }}.json
          draft: false
          prerelease: ${{ steps.channel.outputs.channel == 'testing' }}
          make_latest: false
